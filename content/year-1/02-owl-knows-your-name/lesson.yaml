  - who: hagrid
    line: "Ah, there yeh are! The owls've gone barmy - deliverin' letters to all the wrong people. Neville got a love letter meant fer Filch!"
  - who: ron
    line: And I got Hermione's homework. Twelve feet of it.
  - who: hagrid
    line: The owls read names off a spell. If the spell can't *remember* who it's talkin' to, it gets muddled. Reckon yeh can teach it?
