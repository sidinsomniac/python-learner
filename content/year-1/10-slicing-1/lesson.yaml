scene:
  - who: narrator
    line: Behind a rope in the Restricted Section, you find a half-burnt scroll - the charred remains of an old page of the Ledger.
  - who: hermione
    line: Only bits of it are readable. If we could pick out exactly the letters we need, and skip the burnt ones...
  - who: ashwood
    line: Then you need **slicing** - Parseltongue's way of cutting precisely the pieces you want out of a string.
