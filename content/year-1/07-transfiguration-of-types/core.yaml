tier: core
type: divination
title: Transfiguration Mishaps
twist: inversion of expectations - every line hides a trap
task: |
  McGonagall's students have been transfiguring values. Predict **exactly**
  what each line prints. Every one of them has a trap.
snippet: |
  print(int("7") + 3)
  print("7" * 3)
  print(int(3.99))
  print(bool("False"))
  print(bool(""))
  print(float("2") + 1)
  print(str(4) + str(2))
hints:
  nudge: Every line is a type trick from the lesson. Ask of each one - what type is each value before and after it's transfigured?
  question: Is `"False"` (with quotes) empty? Does `int` round, or chop? What happens when you multiply a string?
  pseudocode: |
    1: text -> number, then add
    2: text repeated
    3: chopped, not rounded
    4: is this string empty?
    5: is THIS string empty?
    6: float plus a number -> float
    7: text glued to text
  flaw: The classic traps are `int(3.99)` (it chops!), `bool("False")` (a non-empty string), and `2.0 + 1` still being a float.
  analogous: |
    ```text
    print(int("4") * 2)    -> 8
    print("4" * 2)         -> 44
    print(bool("no"))      -> True
    print(int(9.9))        -> 9
    ```
