scene:
  - who: ashwood
    line: Every witch and wizard begins with a single spell. Ours is called `print`. Watch.
  - who: narrator
    line: She writes *Hello* on the blackboard with her wand. The chalk shivers, and the word rearranges itself into *olleH*.
  - who: ashwood
    line: "...That is *not* supposed to happen. Never mind. Let's hear your voice, first-year - and let's make sure the castle hears it the right way round."
clue: The blackboard's backwards writing matches **page 1 of the Spell Ledger**. Somebody has rewritten it, in handwriting that isn't Madam Pince's.
