scene:
  - who: narrator
    line: The Grand Staircase swings, groans, and deposits you - yet again - on the fourth floor, outside the Library.
  - who: ron
    line: That's the fifth time today! Every staircase ends up here, no matter where you're going.
  - who: ashwood
    line: Staircases make **decisions** - if this, go there; otherwise, go somewhere else. Someone has been rewriting those decisions.
