nudge: >
  You need two ideas from the lesson: a spell that *listens* and waits for
  typing, and a *trunk* (variable) to keep what was typed.
question: >
  After the student types their name, where does it go? If you don't store
  it in a variable, how would the next line of your spell remember it?
pseudocode: |
  name-trunk becomes (ask "What is your name? " and wait for the answer)
  show "Welcome to Hogwarts, " joined with name-trunk joined with "!"
flaw: >
  Check your welcome line. If the name is inside quotes, Python shows the
  *word* instead of what's in the trunk. And if you used +, did you remember
  the space after the comma?
analogous: |
  A *different* spell with the same shape:

  ```python
  wand = input("What is your wand made of? ")
  print("Ooh, " + wand + ". Very nice!")
  ```
