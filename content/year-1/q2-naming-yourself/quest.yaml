id: y1-q2-naming-yourself
year: 1
order: 2
title: The Owl Knows Your Name
type: practice
concepts: [variables, input, string concatenation]
xp: 60
galleons: 6
summary: Ask a new student their name and welcome them personally.
inputs: ["Harry"]
intro: >
  An owl swoops into the classroom and drops a blank welcome card on your
  desk. "Cards that only ever greet one person are useless," hoots the owl
  (owls at Hogwarts are opinionated). "Make one that greets *anyone*."
success: >
  The card glows and writes the student's name in golden ink. The owl gives
  an approving hoot and flies off to deliver it.
task: |
  Write a spell that:

  1. Asks the student `What is your name? ` using `input`.
  2. Prints `Welcome to Hogwarts, NAME!`, with the student's real name
     in place of NAME.

  For example, if the student types `Hermione`, the spell prints:

  ```
  Welcome to Hogwarts, Hermione!
  ```

  **Testing tip:** the *Answers for input()* box under your wand holds what
  you "type" when your spell asks a question. Change it to try other names!
