id: y1-q1-first-incantation
year: 1
order: 1
title: The First Incantation
type: practice
concepts: [print, strings]
xp: 50
galleons: 5
summary: Make Python speak its very first words.
intro: >
  Professor Ashwood taps the blackboard with her wand. "Every witch and wizard
  begins with a single spell. Ours is called print. Let's hear your voice,
  first-year."
success: >
  The words shimmer in the air above your desk. "Excellent!" says Professor
  Ashwood. "You have spoken your first words of Parseltongue."
task: |
  Write a spell (program) that prints **exactly** these two lines:

  ```
  Hello, Hogwarts!
  I am ready to learn magic.
  ```

  Capital letters, commas and full stops all count - spells are fussy!
