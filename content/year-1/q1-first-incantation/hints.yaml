nudge: >
  This quest is all about one spell: the one that makes Python show text on
  the screen. What was it called in the lesson?
question: >
  How many lines of text should appear? And how many times does your spell
  currently use print?
pseudocode: |
  show the first sentence
  show the second sentence
  (Each "show" is one use of the display spell, with the text inside quotes.)
flaw: >
  Look at how each line of your spell is built: spell name, round brackets,
  and the text inside matching quotes. Is any of those three parts missing or
  mismatched - for example a quote that opens but never closes?
analogous: |
  Here is a *different* spell that shows two lines, so you can see the shape:

  ```python
  print("Mischief")
  print("Managed")
  ```

  Now use the same shape for your own two sentences.
