nudge: >
  Python reads top to bottom. A trunk has to be filled before anything can
  use what's inside it.
question: >
  Imagine the start value is 10. Which gives 30: adding 5 and *then*
  doubling, or doubling and *then* adding 5?
pseudocode: |
  fill the trunk with the starting amount
  do the step that makes it 15
  do the step that makes it 30
  show the balance
flaw: >
  Look at the line that should come first. Does any line use `galleons` on
  the right side of `=` before it has been given a value? And is the print
  line last?
analogous: |
  A *different* puzzle: to end with 12, starting from 3...

  ```text
  x = 3        -> 3
  x = x + 1    -> 4
  x = x * 3    -> 12
  ```

  ...but swap the last two lines and you get 3 * 3 + 1 = 10.
