tier: stage
type: practice
title: "Stage 4: The Ceremony"
twist: combination - every stage together
inputs: ["neville", "b", "x", "B", "a", " c ", "b"]
task: |
  The full ceremony. Ask for the student's **name**, then ask the **5**
  questions - **re-asking** any invalid answer, exactly like Stage 1. Tally the
  houses, break ties like Stage 3, and print the ceremony:

  ```
  ~~~~~~~~~~~~~~~~~~~~~~~~~~
  The Sorting Hat has spoken!
  Gryffindor 1 | Hufflepuff 3 | Ravenclaw 1 | Slytherin 0
  NEVILLE belongs in HUFFLEPUFF!
  ~~~~~~~~~~~~~~~~~~~~~~~~~~
  ```

  The border is **26** `~` signs, and the name and house are in capitals.

  (For the answers shown in the input box: `neville`, then `b`, `x`, `B`,
  `a`, ` c `, `b` - the `x` is invalid and gets asked again.)
starter: |
  # The whole ceremony - plan it in pseudocode first!
tests: |
  BORDER = "~" * 26

  def _ceremony(name, *answers):
      r = run_student([name] + list(answers))
      rows = [l for l in r.stdout.split("\n")]
      check(BORDER in rows, "Where is the 26-character border of ~ signs?")
      start = rows.index(BORDER)
      return rows[start:start + 5]

  def test_example():
      got = _ceremony("neville", "b", "x", "B", "a", " c ", "b")
      check(got[1:2] == ["The Sorting Hat has spoken!"], "After the border: 'The Sorting Hat has spoken!'")
      check(got[2:3] == ["Gryffindor 1 | Hufflepuff 3 | Ravenclaw 1 | Slytherin 0"],
            f"The tally line should be 'Gryffindor 1 | Hufflepuff 3 | Ravenclaw 1 | Slytherin 0' - yours: '{got[2] if len(got) > 2 else ''}'. Did the invalid x get asked again, and did ' c ' and 'B' count?")
      check(got[3:5] == ["NEVILLE belongs in HUFFLEPUFF!", BORDER], f"Then the verdict in capitals, and the border. Yours: {got[3:5]}.")

  def test_tie():
      got = _ceremony("Cho", "c", "a", "a", "c", "d")
      check(got[3:4] == ["CHO belongs in RAVENCLAW!"], f"Ravenclaw and Gryffindor tie, and c came first. You printed {got[3:4]}.")

  def test_many_invalid():
      got = _ceremony("Draco", "d", "?", "yes", "d", "D", "a", "d")
      check(got[2:4] == ["Gryffindor 1 | Hufflepuff 0 | Ravenclaw 0 | Slytherin 4", "DRACO belongs in SLYTHERIN!"],
            f"With several invalid answers mixed in you printed {got[2:4]}. Every question must keep asking until it gets a valid letter.")
hints:
  nudge: You've already written every piece in Stages 1-3. Stage 4 is about joining them together - in the right order.
  question: Where does Stage 1's ask-until-valid loop go now? (Hint - it happens once per question.)
  pseudocode: |
    name = ask
    answers = an empty list
    repeat 5 times:
        answer = ask, cleaned up
        keep re-asking while it's invalid
        add it to answers
    count each house
    find the winner with the tie rule
    show the border, the heading, the tally line, the verdict, the border
  flaw: >
    If the tally is off by one, an invalid answer is being counted, or a valid
    one is being skipped. If the name is lowercase, you forgot `.upper()`.
  analogous: |
    A loop that contains an ask-until-valid loop:

    ```text
    for each of 3 questions:
        answer = ask
        while answer is not yes/no: answer = ask again
        store it
    ```
