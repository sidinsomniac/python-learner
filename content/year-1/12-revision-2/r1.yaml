tier: review
type: divination
title: The Alohomora Riddle
task: Predict every line this spell prints.
snippet: |
  word = "Alohomora"
  print(len(word), word[0], word[-1])
  print(word[2:5].upper())
  print(7 // 2 + 7 % 2)
  print(f"{2 / 8:.2f}")
  print(word[::-3])
hints:
  nudge: Take it one line at a time, and write out the positions of every letter in Alohomora (starting at 0!).
  question: Which positions does `[2:5]` include? And which does `[::-3]` visit - starting from which end?
  pseudocode: |
    line 2: length, first letter, last letter (commas add spaces)
    line 3: positions 2, 3, 4 - in capitals
    line 4: whole part plus remainder
    line 5: a quarter, with two decimals
    line 6: start at the END and jump back 3 each time
  flaw: The traps are `[2:5]` stopping BEFORE position 5, and `[::-3]` starting from the last letter.
  analogous: |
    ```text
    w = "Hedwig"
    print(w[1:3])    -> ed
    print(w[::-2])   -> gwe
    ```
