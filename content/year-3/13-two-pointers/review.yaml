# Time-Turner and Dueling Club cards for this lesson.
- id: which-pointer
  type: choice
  q: Two pointers on a SORTED list are looking for a pair summing to 50. The current sum is 42. What next?
  options: ["Move the right pointer left", "Move the left pointer right", "Start again from the middle"]
  answer: 1
  why: Only a bigger left number can raise the sum - the right number is already the biggest left in play.
- id: fixed-window
  type: predict
  code: |
    drops = [4, 1, 3, 6, 2]
    window = sum(drops[:2])
    sums = [window]
    for right in range(2, len(drops)):
        window += drops[right] - drops[right - 2]
        sums.append(window)
    print(sums, max(sums))
  why: Each slide adds the page coming in and subtracts the page leaving - no re-adding the whole window.
- id: hand-sorts
  type: choice
  q: Which statement about hand sorts (selection, insertion) is true?
  options: ["They're O(n log n), like sorted()", "They're O(n²); insertion sort is fast only on nearly sorted data", "Interviews always ask you to write them"]
  answer: 1
  why: Both are O(n²) in general. In real spells, use sorted() - it's O(n log n) and stable.
