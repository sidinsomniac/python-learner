tier: review
type: practice
title: The Top of the Class
task: |
  Write `top_n(records, n, key)`. `key` is a spell that scores a record.
  Return the `n` records with the **highest** scores, highest first. Records
  with equal scores keep their original order. If `n` is bigger than the
  number of records, return them all.

  ```python
  marks = [("Neville", 6), ("Hermione", 10), ("Ron", 6), ("Harry", 8)]

  def mark(record):
      return record[1]

  top_n(marks, 3, mark)
  # -> [('Hermione', 10), ('Harry', 8), ('Neville', 6)]
  ```
