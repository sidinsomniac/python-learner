title: "★ Binary Search: The Fading Ink"
location: The Hufflepuff basement
concepts: [binary search on a condition, the boundary between False and True, searching an answer, counting calls]
exercises: [warmup, core, outstanding]
scene:
  - who: narrator
    line: Behind a barrel in the Hufflepuff basement, Crookshanks is sitting on an old school trunk, and refuses to move. Its lid is stamped "T. W. 1926".
  - who: hermione
    line: (lifting out a fat, battered diary) His diary! A million pages - it's charmed to never run out. But look... the ink fades. From one page onward, everything is blank.
  - who: ron
    line: So we find the last page he wrote before it faded. Page by page?
  - who: ashwood
    line: Every page is either still clear or already faded, and once the ink fades it never comes back. That's all binary search needs - not a sorted list, just a line between "no" and "yes".
clue: "The last clear entry: \"Failed Arithmancy. Borrowed the prototype from the Ministry exhibit. **One more turn and I'll get it right.**\""
