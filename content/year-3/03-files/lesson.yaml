scene:
  - who: pince
    line: (unlocking a cage of iron bars) The Hall of Records. Every student who ever set foot in this castle is written down here. Touch nothing. Breathe quietly.
  - who: hermione
    line: If the boy is a former student, he's in here somewhere. But there are thousands of scrolls...
  - who: pince
    line: Scrolls? We keep them as *files* now. Plain text, one student to a line, fields split by commas. Some of them, I'm sorry to say, are... smudged.
  - who: ashwood
    line: A spell that can read a file can search a whole century in a heartbeat. Let's learn to open one - and to close it again properly.
clue: The 1926 ledger has one record with a start year and **no leaving date**. Tobias Wren, Hufflepuff, started 1923. He never left.
