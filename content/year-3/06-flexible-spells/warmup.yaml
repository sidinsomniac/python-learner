tier: warmup
type: practice
title: The Galleon Counter
task: |
  Write `total(*amounts)`. It adds up however many amounts it's given.
  With none at all, the total is `0`.

  ```python
  total(5, 10, 2)   # -> 17
  total(7)          # -> 7
  total()           # -> 0
  ```
starter: |
  def total(a, b):
      return a + b
tests: |
  def test_many():
      fn = student_function("total")
      check(call(fn, 5, 10, 2) == 17, f"total(5, 10, 2) returned {call(fn, 5, 10, 2)!r}.")
      check(call(fn, 1, 2, 3, 4, 5, 6) == 21, "total should take six amounts just as happily as three.")

  def test_few():
      fn = student_function("total")
      check(call(fn, 7) == 7, "total(7) should be 7.")
      check(call(fn) == 0, "total() with nothing at all should be 0.")

  def test_spread():
      fn = student_function("total")
      check(call(fn, *[4, 4, 4]) == 12, "total(*[4, 4, 4]) spreads a list into three amounts.")
hints:
  nudge: One starred parameter can catch every amount, however many there are.
  question: What type does a `*amounts` parameter arrive as? Which built-in spell adds up everything in one of those?
  pseudocode: |
    define total with one starred parameter
        give back the sum of everything it caught
  flaw: If total() crashes with "missing required positional argument", your spell still has ordinary parameters that must be filled.
  analogous: |
    ```python
    def longest(*words):
        return max(words, key=len) if words else ""
    ```
