# Time-Turner and Dueling Club cards for this lesson.
- id: which-sort
  type: choice
  q: A list of 10,000 items is sorted except for two neighbours swapped. Which hand-sort finishes fastest?
  options: ["Selection sort", "Insertion sort", "They take the same time"]
  answer: 1
  why: Insertion sort barely moves anything on nearly sorted data. Selection sort scans the rest of the list on every pass regardless.
- id: one-pass
  type: predict
  code: |
    items = [6, 3, 8, 1]
    for start in range(2):
        low = start
        for i in range(start + 1, len(items)):
            if items[i] < items[low]:
                low = i
        items[start], items[low] = items[low], items[start]
        print(items)
  why: Each selection pass swaps the smallest remaining item into the next position - 1 first, then 3.
- id: stable
  type: choice
  q: What does it mean for a sort to be stable?
  options: ["It never crashes", "Equal items keep their original order", "It sorts in place"]
  answer: 1
  why: Stability matters when sorting by one key after another - the earlier order survives among ties.
