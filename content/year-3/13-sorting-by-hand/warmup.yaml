tier: warmup
type: practice
title: One Page Into Place
task: |
  Write `selection_pass(pages, start)`. It's **one pass** of selection
  sort. Find the smallest page number at position `start` or after it, and
  swap it into position `start`. If several are equally small, use the
  first. It changes `pages` in place and returns nothing.

  ```python
  pages = [9, 4, 7, 2, 8]
  selection_pass(pages, 0)   # pages is now [2, 4, 7, 9, 8]
  selection_pass(pages, 2)   # pages is now [2, 4, 7, 9, 8]  (7 is already the smallest)
  selection_pass(pages, 3)   # pages is now [2, 4, 7, 8, 9]
  ```
starter: |
  def selection_pass(pages, start):
      smallest = min(pages)
      pages.remove(smallest)
      pages.insert(start, smallest)
tests: |
  def test_example():
      fn = student_function("selection_pass")
      pages = [9, 4, 7, 2, 8]
      call(fn, pages, 0)
      check(pages == [2, 4, 7, 9, 8], f"After selection_pass(pages, 0), pages is {pages}. Did 9 and 2 swap places?")
      call(fn, pages, 2)
      check(pages == [2, 4, 7, 9, 8], f"From position 2, 7 is already the smallest. pages became {pages}.")
      call(fn, pages, 3)
      check(pages == [2, 4, 7, 8, 9], f"After the pass from 3, pages is {pages}.")

  def test_only_after_start():
      fn = student_function("selection_pass")
      pages = [1, 9, 0, 5]
      call(fn, pages, 1)
      check(pages == [1, 0, 9, 5], f"Only positions from `start` onwards take part. pages became {pages}.")

  def test_first_of_equals():
      fn = student_function("selection_pass")
      pages = [5, 3, 3, 9]
      call(fn, pages, 0)
      check(pages == [3, 5, 3, 9], f"With two 3s, the first one should be swapped in. pages became {pages}.")
      check(call(fn, [1], 0) is None, "selection_pass changes the list in place and returns nothing.")
hints:
  nudge: Remember the POSITION of the smallest so far, starting at `start`. Then swap two positions.
  question: Why does the position matter more than the value here? Which comparison keeps the first of several equal pages?
  pseudocode: |
    smallest position starts at start
    for every position after start:
        if the page there is strictly smaller than the page at the smallest position: remember this position
    swap the pages at start and at the smallest position
  flaw: If pages from before `start` get moved, your search began at 0. If the second 3 is chosen, you used <= instead of <.
  analogous: |
    ```python
    def biggest_to_end(marks):
        best = 0
        for pos in range(1, len(marks)):
            if marks[pos] > marks[best]:
                best = pos
        marks[best], marks[-1] = marks[-1], marks[best]
    ```
