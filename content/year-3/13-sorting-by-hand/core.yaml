tier: core
type: practice
title: The Gentlest Sort
twist: comparison - count the moves, and see which data each sort is kind to
task: |
  Write `insertion_sort(pages)`. It sorts `pages` **in place** with
  insertion sort, and **returns the number of moves**: each time a page is
  shifted one place to the right, that's one move.

  ```python
  pages = [3, 1, 2]
  insertion_sort(pages)   # -> 2   (3 shifts right twice)
  pages                   # [1, 2, 3]
  insertion_sort([1, 2, 3, 4])   # -> 0
  insertion_sort([4, 3, 2, 1])   # -> 6
  ```

  Equal pages must never be moved past each other. No `sort` or `sorted`.
  The examiners will hand you 5,000 nearly-sorted pages, so make sure your
  spell does almost no work when there's almost nothing to do.
starter: |
  def insertion_sort(pages):
      moves = 0
      for i in range(1, len(pages)):
          for j in range(i):
              if pages[j] > pages[i]:
                  pages[j], pages[i] = pages[i], pages[j]
                  moves += 1
      return moves
tests: |
  def test_example():
      fn = student_function("insertion_sort")
      pages = [3, 1, 2]
      got = call(fn, pages)
      check(pages == [1, 2, 3], f"After sorting, pages is {pages}.")
      check(got == 2, f"insertion_sort([3, 1, 2]) returned {got!r}. How many times did a page shift one place right?")

  def test_counts():
      fn = student_function("insertion_sort")
      for pages, want in [([1, 2, 3, 4], 0), ([4, 3, 2, 1], 6), ([], 0), ([7], 0), ([2, 1, 2, 1], 3)]:
          original = list(pages)
          got = call(fn, pages)
          check(pages == sorted(original), f"{original} sorted to {pages}.")
          check(got == want, f"insertion_sort({original}) returned {got!r} moves, not {want}. Do equal pages ever get shifted past each other?")

  def test_nearly_sorted():
      fn = student_function("insertion_sort")
      pages = list(range(5000))
      pages[100], pages[101] = pages[101], pages[100]
      pages[4000], pages[4003] = pages[4003], pages[4000]
      got = call(fn, pages)
      check(pages == list(range(5000)), "5,000 nearly sorted pages should come out sorted.")
      check(got == 6, f"Only a few pages are out of place, so only a few moves are needed. You counted {got}.")

  def test_reversed():
      fn = student_function("insertion_sort")
      pages = list(range(200, 0, -1))
      got = call(fn, pages)
      check(pages == list(range(1, 201)) and got == 19900, f"200 reversed pages need 19,900 moves - every pair is out of order. You counted {got}.")
      check(not calls("sort") and not calls("sorted"), "Sort by hand - no sort() or sorted().")
hints:
  nudge: Lift out the next page, slide bigger pages one place right to make a gap, and drop the page into the gap. Count every slide.
  question: When should the sliding stop - at the first page that's smaller, or at the first that's smaller or equal? What stops it at the very front?
  pseudocode: |
    moves starts at 0
    for each position from the second to the last:
        lift out the page there
        look left, one position at a time:
            while there is a position, and the page there is strictly bigger:
                shift that page one place right, and count a move
        drop the lifted page into the gap
    give back moves
  flaw: If the nearly sorted test is slow, your spell compares every pair, even when nothing needs moving. Stop looking left as soon as a page isn't bigger.
  analogous: |
    ```python
    def insert_card(hand, card):
        hand.append(card)
        k = len(hand) - 1
        while k > 0 and hand[k - 1] > card:
            hand[k] = hand[k - 1]
            k -= 1
        hand[k] = card
    ```
