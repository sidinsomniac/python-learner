title: The Arithmancer's Root
leetcodeLike: Sqrt(x)
requires: y3-l07b
order: 3
complexity:
  options: ["O(n)", "O(√n)", "O(log n)", "O(1)"]
  answer: 2
  why: The range of possible roots (0 to n) is halved with each guess. Counting up from 1 would take about √n steps - a million for n = 10¹².
task: |
  Professor Vector wants the **whole-number square root** of `n`, rounded
  down, without any shortcuts. Write `whole_root(n)` for any `n >= 0`.

  ```python
  whole_root(16)
  # -> 4
  whole_root(15)
  # -> 3   (3 * 3 = 9 fits, 4 * 4 = 16 is too big)
  ```

  No `**`, no `pow()` and no `math`. Some numbers are as big as 10¹²: counting
  up one guess at a time is far too slow.
starter: |
