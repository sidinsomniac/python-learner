title: The Runic Numerals
leetcodeLike: Roman to Integer
requires: y2-l07
order: 3
complexity:
  options: ["O(n²)", "O(n log n)", "O(n)", "O(1)"]
  answer: 2
  why: Each symbol is looked up in a dict once, and compared with its neighbour once.
task: |
  Old Gringotts vaults are numbered in Roman numerals. Write
  `roman_value(numeral)`: turn a numeral into a number.

  `I` 1, `V` 5, `X` 10, `L` 50, `C` 100, `D` 500, `M` 1000. Symbols are
  added up, **except** when a smaller symbol comes right before a bigger one:
  then it's taken away (`IV` is 4, `XC` is 90, `CM` is 900).

  ```python
  roman_value("XII")
  # -> 12
  roman_value("MCMXCIV")
  # -> 1994
  ```
starter: |
