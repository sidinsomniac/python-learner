title: The Two Registers
leetcodeLike: Merge Sorted Array
requires: y3-l08
order: 3
complexity:
  options: ["O(n²)", "O((n + m) log(n + m))", "O(n + m)", "O(1)"]
  answer: 2
  why: Each name is compared and copied once. Joining the lists and calling sorted() works, but costs O((n + m) log(n + m)) and ignores that both are already in order.
task: |
  Two prefects kept separate registers of students' heights, each **already
  sorted** from shortest to tallest. Write `merge_sorted(a, b)`: return one
  new sorted list with every height from both.

  ```python
  merge_sorted([120, 135, 150], [125, 160])
  # -> [120, 125, 135, 150, 160]
  ```

  Use the fact that both are sorted: no `sorted()` and no `.sort()`. Each
  register can hold 10,000 heights.
