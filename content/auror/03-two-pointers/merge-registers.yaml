tests: |
  def test_examples():
      fn = student_function("merge_sorted")
      got = call(fn, [120, 135, 150], [125, 160])
      check(got == [120, 125, 135, 150, 160], f"You gave {got!r}. Which register's next height is smaller, at each step?")

  def test_edges():
      fn = student_function("merge_sorted")
      check(call(fn, [], []) == [], "Two empty registers merge into an empty one.")
      check(call(fn, [1, 2], []) == [1, 2], "When b is empty, the answer is just a's heights. Don't lose the leftovers.")
      check(call(fn, [], [3]) == [3], "When a is empty, the answer is just b's heights.")
      got = call(fn, [5, 5, 9], [5, 6])
      check(got == [5, 5, 5, 6, 9], f"merge_sorted([5, 5, 9], [5, 6]) gave {got!r}. Equal heights all stay.")
      a = [1, 3]
      call(fn, a, [2])
      check(a == [1, 3], "Don't change the registers you were given; build a new list.")

  def test_big_registers():
      fn = student_function("merge_sorted")
      check(not calls("sorted") and not calls("sort"), "No sorted() or .sort() - both registers are already in order, so walk them together.")
      a = list(range(0, 20000, 2))
      b = list(range(1, 20000, 2))
      got = timed(fn, a, b, limit=1.5, question="Correct, but slow. Does each height get looked at only once?")
      check(got == list(range(20000)), "The big merge isn't right.")
hints:
  nudge: Keep one pointer in each register. At every step, the smaller of the two heights they point at goes next.
  question: When one register runs out, what happens to whatever is left in the other?
  pseudocode: |
    i and j start at 0; merged = an empty list
    while both registers have heights left:
        copy the smaller of a[i] and b[j] across, and move that pointer on
    copy across whatever is left of a, then of b
    give back merged
  flaw: If merge_sorted([1, 2], []) gives [], the leftovers were never copied after the loop ended.
  analogous: |
    ```python
    def interleave(left, right):
        out = []
        p = q = 0
        while p < len(left) and q < len(right):
            out.append(left[p])
            out.append(right[q])
            p, q = p + 1, q + 1
        return out + left[p:] + right[q:]
    ```
