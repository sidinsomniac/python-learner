title: The Mirror Scroll
leetcodeLike: Reverse String
requires: y3-l08
order: 1
complexity:
  q: How much extra memory does your solution use, for n letters?
  options: ["O(n)", "O(log n)", "O(1)", "O(n²)"]
  answer: 2
  why: Only two position variables, however long the scroll is. Building a reversed copy would use O(n) extra memory.
task: |
  The Mirror of Erised shows everything backwards. Write
  `mirror(letters)`: reverse a **list** of letters **in place**: change the
  list you're given, and return nothing.

  ```python
  scroll = ["E", "r", "i", "s", "e", "d"]
  mirror(scroll)
  print(scroll)
  # -> ['d', 'e', 's', 'i', 'r', 'E']
  ```

  No copies: no slicing, no `reversed()`, no `.reverse()`, and no new list.
  Swap letters with two pointers.
starter: |
