title: The Brightest Stretch
leetcodeLike: Maximum Average Subarray I
requires: y3-l08
order: 2
complexity:
  options: ["O(n·k)", "O(n log n)", "O(n)", "O(k)"]
  answer: 2
  why: The window's total is updated with one addition and one subtraction per step. Re-adding all k readings at every position is O(n·k).
task: |
  Professor Sinistra records the brightness of the sky every minute. Write
  `brightest(readings, k)`: the largest total brightness over any **k
  consecutive** readings.

  ```python
  brightest([1, 12, -5, -6, 50, 3], 4)
  # -> 51   (12 - 5 - 6 + 50)
  brightest([5, 5], 2)
  # -> 10
  ```

  `k` is always between 1 and the number of readings. Some nights have 20,000
  readings, and k can be 5,000.
starter: |
