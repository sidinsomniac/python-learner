scene:
  - who: filch
    line: Three hundred and twelve items gone from this castle! I've written every one down. Do you think anyone's *read* my list?
  - who: hermione
    line: A list that long hides its own pattern. We need to tally it - how many of each kind of thing went missing.
  - who: ron
    line: Tally? Like counting sheep, but with... stolen sheep?
  - who: ashwood
    line: Exactly like that, Ron. A dictionary can keep a running count for every kind of thing at once. It's one of the most useful patterns in all of Parseltongue.
clue: The tally speaks for itself - almost everything that vanished is **shiny**. Mirrors, trophies, badges, silver cups.
