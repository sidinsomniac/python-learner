scene:
  - who: ginny
    line: The Owl Post found the Borgin and Burkes receipt! It's... a mess. Smudged, crooked, half of it written sideways.
  - who: ron
    line: Can't we just read it?
  - who: hermione
    line: We could read ONE receipt. But the Owl Post has four hundred of them, and we need to know which ones matter.
  - who: ashwood
    line: Then we teach Python to read them for us. Turning messy text into tidy data is called *parsing* - and it's half of what real programmers do all day.
clue: 'Parsed properly, the receipt reads: "One cabinet, self-filling. Charm by G. Lockhart. Deliver to: second-floor girls'' bathroom."'
