tier: outstanding
type: practice
title: The Owl Post Ledger
twist: design - parse a table, then print it back out perfectly aligned
task: |
  The Owl Post ledger is a table: a header line, then rows, with columns
  separated by `|` and messy spaces.

  1. `parse_table(text)` returns a list of dictionaries, one per row, keyed by
     the (stripped) header names. Values are stripped; all-digit values become
     `int`s. Blank lines are skipped. A row with the wrong number of columns
     is skipped too.
  2. `format_table(rows, columns)` returns a single string: the column names,
     then one line per row, each column **left-aligned** and padded to the
     width of its longest entry (header included), columns separated by
     ` | `. Lines are joined with `\n`, with no trailing spaces.

  ```python
  ledger = """ owl | to | parcels
  Errol | The Burrow | 2
  Hedwig|Hogwarts|  11
  broken | row
  """
  rows = parse_table(ledger)
  # [{'owl': 'Errol', 'to': 'The Burrow', 'parcels': 2}, {'owl': 'Hedwig', 'to': 'Hogwarts', 'parcels': 11}]
  print(format_table(rows, ["owl", "parcels"]))
  # owl    | parcels
  # Errol  | 2
  # Hedwig | 11
  ```
