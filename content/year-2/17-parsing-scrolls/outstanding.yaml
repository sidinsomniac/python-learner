tests: |
  LEDGER = " owl | to | parcels\nErrol | The Burrow | 2\nHedwig|Hogwarts|  11\nbroken | row\n"

  def test_parse():
      got = call(student_function("parse_table"), LEDGER)
      check(got == [{"owl": "Errol", "to": "The Burrow", "parcels": 2}, {"owl": "Hedwig", "to": "Hogwarts", "parcels": 11}],
            f"parse_table returned {got!r}.")

  def test_parse_empty():
      check(call(student_function("parse_table"), "a | b\n\n") == [], "A header with no rows gives an empty list.")

  def test_format():
      rows = [{"owl": "Errol", "to": "The Burrow", "parcels": 2}, {"owl": "Hedwig", "to": "Hogwarts", "parcels": 11}]
      got = call(student_function("format_table"), rows, ["owl", "parcels"])
      want = "owl    | parcels\nErrol  | 2\nHedwig | 11"
      check(got == want, f"format_table returned:\n{got}\n\nExpected:\n{want}")

  def test_format_last_column():
      rows = [{"a": "x", "b": "long value"}, {"a": "yy", "b": "z"}]
      got = call(student_function("format_table"), rows, ["b", "a"])
      want = "b          | a\nlong value | x\nz          | yy"
      check(got == want, f"format_table returned:\n{got}\n\nExpected:\n{want}\n(No spaces at the end of any line!)")
hints:
  nudge: parse_table - the first non-blank line gives the names; every later line is split the same way and zipped up with them. format_table - work out each column's width first, then build each line.
  question: How wide must each column be? (Think about every value in it, as a string, AND its header.) How do you stop trailing spaces appearing on the last column?
  pseudocode: |
    parse_table:
        lines = the non-blank lines
        names = the first line split at "|", each stripped
        for each later line: split and strip the cells; skip it if the count is wrong
            make a dictionary pairing names with cells (digits become numbers)
    format_table:
        widths = for each column, the longest of its header and every value as text
        for the header and each row: pad each cell to its column's width, join with " | ", strip the right end
        join the lines with newlines
  flaw: If numbers break the width, convert every value with str() before measuring. If a test shows spaces at the end of a line, strip the right-hand end of each line.
  analogous: |
