id: y2-l14
year: 2
order: 21
number: 14
title: Debugging Craft
location: Professor Lockhart's office
concepts: [reading tracebacks, error types, print debugging, assert, changing a list while looping, the Pensieve]
exercises: [warmup, core, outstanding]
scene:
  - who: lockhart
    line: "(pale, cornered, still smiling) All right, ALL right. Yes, the Cabinet is mine. A tiny bit of harmless decoration. And yes, I wrote a counter-spell. It's... nearly perfect."
  - who: ginny
    line: "Nearly?"
  - who: lockhart
    line: "It un-collects most things. Some things. It un-collected my eyebrows once. Temporarily!"
  - who: hermione
    line: "(very quietly) Professor. Did you write the spells in your books?"
  - who: lockhart
    line: "(the smile goes out, just for a moment) ...I write them *down*, Miss Granger. That's not quite the same. (the smile comes back on) Now! Debugging!"
  - who: ashwood
    line: "Then we debug it, calmly, one clue at a time: read the error, form a guess, test it. Where would you start, {name}?"
clue: With its bugs fixed, Lockhart's counter-spell really works - it can **empty the Cabinet**. If only you knew the password to open it.
outro:
  - who: lockhart
    line: "(watching the fixed spell run) Oh. Oh, that's... that's rather good. Better than mine. (softly) Most things are."
  - who: ginny
    line: "(to you, surprised) I think that's the first true thing he's said all year."
