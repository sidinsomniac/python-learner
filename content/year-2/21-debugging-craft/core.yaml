tier: core
type: repair
title: The Un-Collecting Counter-Spell
twist: debug - removing from a list while looping over it
task: |
  Lockhart's counter-spell `uncollect(hoard, owner)` should:

  - **remove** every `(item, owner)` pair belonging to `owner` from `hoard`
    (changing `hoard` itself - that's how the Cabinet empties), ignoring
    capitals in the owner's name;
  - **return** the list of that owner's items, in hoard order.

  ```python
  hoard = [("mirror", "Myrtle"), ("tiara", "myrtle"), ("head", "Nick"), ("cup", "Myrtle")]
  uncollect(hoard, "Myrtle")   # ['mirror', 'tiara', 'cup']
  hoard                        # [('head', 'Nick')]
  ```

  It has **three** bugs. Find them with debug prints or the Pensieve - don't
  rewrite it from scratch.
starter: |
  def uncollect(hoard, owner):
      returned = []
      for pair in hoard:
          if pair[1] == owner:
              returned.append(pair[0])
              hoard.remove(pair)
          return returned

  hoard = [("mirror", "Myrtle"), ("tiara", "myrtle"), ("head", "Nick"), ("cup", "Myrtle")]
  print(uncollect(hoard, "Myrtle"), hoard)
tests: |
  def _fn():
      fn = run_student(allow_error=True).ns.get("uncollect")
      check(callable(fn), "I can't find `uncollect` - keep its name.")
      return fn

  def test_example():
      hoard = [("mirror", "Myrtle"), ("tiara", "myrtle"), ("head", "Nick"), ("cup", "Myrtle")]
      got = call(_fn(), hoard, "Myrtle")
      check(got == ["mirror", "tiara", "cup"], f"uncollect returned {got!r}.")
      check(hoard == [("head", "Nick")], f"After un-collecting Myrtle's things, the hoard is {hoard!r}.")

  def test_neighbours():
      hoard = [("a", "Nick"), ("b", "Nick"), ("c", "Nick")]
      got = call(_fn(), hoard, "nick")
      check(got == ["a", "b", "c"] and hoard == [], f"Three of Nick's things in a row: you returned {got!r} and left {hoard!r}. What happens to the loop when an item is removed under its feet?")

  def test_nobody():
      hoard = [("cup", "Filch")]
      got = call(_fn(), hoard, "Peeves")
      check(got == [] and hoard == [("cup", "Filch")], f"Peeves owns nothing: you returned {got!r} and left {hoard!r}.")
hints:
  nudge: Run it in the Pensieve with three of Nick's things in a row and watch `pair` - which ones does the loop actually visit?
  question: What happens to the positions of the later items when you remove one? Where does `return returned` sit - inside the loop or after it? Does "myrtle" equal "Myrtle"?
  pseudocode: |
    returned = empty list
    for each pair in a COPY of the hoard:
        if the pair's owner matches, ignoring case:
            remember its item, and remove the pair from the real hoard
    give back returned (after the loop)
  flaw: Three bugs - the return is inside the loop; the owner comparison is case-sensitive; and removing from the list you're looping over makes the loop skip the next item.
  analogous: |
    ```python
    nums = [2, 2, 3]
    for n in nums[:]:
        if n == 2:
            nums.remove(n)
    ```
