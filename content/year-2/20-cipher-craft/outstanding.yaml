tier: outstanding
type: practice
title: Crack It with E
twist: edge case - capitals, punctuation, ties, and messages with no letters
task: |
  Write `crack_by_e(text)`: assume the most common letter in the coded text
  stands for `E`, work out the shift, and return a tuple
  `(shift, decoded_text)`.

  - Count letters ignoring case; ignore everything that isn't a letter.
  - If several letters tie for most common, use the one that comes **first
    in the alphabet**.
  - The shift is between 0 and 25 (so `caesar(plain, shift)` gives the coded
    text back).
  - If the text has no letters at all, return `(0, text)`.

  You'll need your `caesar`/`decode` spells from the core challenge - include
  them in your answer.

  ```python
  crack_by_e("AOL JHIPULA OBUNLYZ. MLLK PA ZOPUF AOPUNZ.")
  # (7, 'THE CABINET HUNGERS. FEED IT SHINY THINGS.')
  ```
