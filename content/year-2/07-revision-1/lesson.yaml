id: y2-r1
year: 2
order: 7
number: R1
kind: revision
title: Revision I - Filch Objects
location: Filch's office
concepts: [lists, copies, tuples, dictionaries, counting]
exercises: [r1, r2, r3]
scene:
  - who: ron
    line: "It's obvious. Filch collects confiscated things. Things are vanishing. Filch did it!"
  - who: filch
    line: "I *CONFISCATE*, Weasley. I don't *STEAL*. There's a difference, and it's written down - in triplicate!"
  - who: hermione
    line: "Then let's check his records properly. If they clear him, they clear him."
  - who: ginny
    line: "(to Ron, low) You said Draco did it last week. And Peeves the week before."
  - who: ashwood
    line: "Revision, then: lists, tuples and dictionaries. And a fair test, before anyone is accused. What would count as proof, {name}?"
clue: Filch's own records give him an alibi for every single vanishing. **Filch is cleared** - and he's never been so pleased to be boring.
outro:
  - who: ron
    line: "(red to the ears) Sorry, Mr Filch."
  - who: filch
    line: "(stiffly) Apology... noted. In triplicate."
  - who: ron
    line: "(later, to you) Next time, I'm checking the data first. Don't tell Hermione I said that."
