tier: outstanding
type: practice
title: collect_admirers
twist: edge case - returning None on purpose, and ties
task: |
  Recreate Lockhart's spells - properly. Letters are `(sender, hearts)` tuples.

  1. `collect_admirers(letters, minimum)` returns the list of senders with at
     least `minimum` hearts, **in the order they wrote**, each sender only
     once (some write again and again!).
  2. `top_admirer(letters)` returns the sender whose letters add up to the
     **most hearts in total**. On a tie, whoever wrote **first** wins. With no
     letters at all it returns `None` - deliberately.

  ```python
  mail = [("Ann", 3), ("Bob", 5), ("Ann", 4), ("Cy", 7)]
  collect_admirers(mail, 4)
  # -> ['Bob', 'Ann', 'Cy']
  top_admirer(mail)
  # -> 'Ann'  (3 + 4 = 7, ties with Cy but wrote first)
  ```
