tier: outstanding
type: practice
title: The Owl Post Manifest
twist: combination - JSON in, grouping and counting with collections, JSON out
task: |
  The Owl Post office keeps its deliveries as JSON text, like this:

  ```python
  manifest = '[{"to": "Lockhart", "item": "mirror"}, {"to": "Filch", "item": "yo-yo"}, {"to": "Lockhart", "item": "cup"}]'
  ```

  Write two spells. Use `json`, and `collections`:

  1. `group_deliveries(text)` returns **JSON text** of an object mapping
     each recipient to the list of items they received, in delivery order,
     with the recipients **sorted** alphabetically.
  2. `busiest(text)` returns the name of the recipient with the most
     deliveries. On a tie, the one whose first delivery came first wins.
     With no deliveries at all, it returns `None`.

  ```python
  group_deliveries(manifest)
  # -> '{"Filch": ["yo-yo"], "Lockhart": ["mirror", "cup"]}'
  busiest(manifest)
  # -> 'Lockhart'
  ```
starter: |
