tier: outstanding
type: practice
title: The Farthest Vanishings
twist: design - compare every pair exactly once, and leave the caller's list alone
task: |
  The vanishings are a dictionary of name -> `(x, y)` position on Ginny's
  map.

  1. `farthest_pair(spots)` returns a tuple of the two names that are
     **farthest apart** (straight-line distance), in the dictionary's order.
     On a tie, the pair found first wins (walk the names in order, pairing
     each only with the names after it). With fewer than two spots, return
     `None`.
  2. `patrol(names, seed)` returns a **new** shuffled list of the names -
     seed the generator with `seed`, shuffle a **copy**, and leave `names`
     untouched.

  ```python
  spots = {"mirror": (0, 0), "cup": (3, 4), "head": (1, 1)}
  farthest_pair(spots)       # ('mirror', 'cup')   - 5.0 apart
  ```
