tests: |
  import json

  MANIFEST = '[{"to": "Lockhart", "item": "mirror"}, {"to": "Filch", "item": "yo-yo"}, {"to": "Lockhart", "item": "cup"}]'

  def test_group():
      fn = student_function("group_deliveries")
      got = call(fn, MANIFEST)
      check(isinstance(got, str), f"group_deliveries should give back JSON TEXT (a string). It gave {type(got).__name__}.")
      check(json.loads(got) == {"Filch": ["yo-yo"], "Lockhart": ["mirror", "cup"]}, f"The groups were {got}.")
      check(got == '{"Filch": ["yo-yo"], "Lockhart": ["mirror", "cup"]}', f"Are the recipients sorted? You gave {got}.")
      check(call(fn, "[]") == "{}", "With no deliveries, the JSON is an empty object: {}.")

  def test_busiest():
      fn = student_function("busiest")
      check(call(fn, MANIFEST) == "Lockhart", f"busiest(manifest) returned {call(fn, MANIFEST)!r}.")
      tie = '[{"to": "Ron", "item": "rat"}, {"to": "Ginny", "item": "diary"}, {"to": "Ginny", "item": "quill"}, {"to": "Ron", "item": "wand"}]'
      check(call(fn, tie) == "Ron", "Ron and Ginny tie on 2, and Ron's first delivery came first.")
      check(call(fn, "[]") is None, "With no deliveries, nobody is busiest.")

  def test_tools():
      check(calls("loads"), "Read the JSON text with json.loads.")
      check(calls("dumps"), "Write the JSON text with json.dumps - don't build it by hand.")
      check(calls("Counter") or calls("defaultdict"), "Could a Counter or a defaultdict from collections do the counting or grouping for you?")
hints:
  nudge: Turn the text into Python with json, group with a defaultdict and count with a Counter, then turn the groups back into text with json.
  question: Which json option sorts the keys for you? Does Counter's most_common keep the earlier recipient first when two counts tie?
  pseudocode: |
    group_deliveries:
        read the deliveries from the text
        groups = a defaultdict of lists; add each item under its recipient
        give back the groups as JSON text, with sorted keys
    busiest:
        read the deliveries; count the recipients with a Counter
        if nothing was counted: give back None
        give back the name from the single most common entry
  flaw: If the JSON has single quotes or None in it, you built it with str() instead of json.dumps. If ties go the wrong way, check the order the recipients were counted in.
  analogous: |
    ```python
    import json
    from collections import Counter

    def top_house(text):
        houses = Counter(s["house"] for s in json.loads(text))
        return houses.most_common(1)[0][0] if houses else None
    ```
