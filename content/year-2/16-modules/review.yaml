# Time-Turner and Dueling Club cards for this lesson.
- id: from-import
  type: choice
  q: After `from math import sqrt`, which call works?
  options: ["`math.sqrt(9)`", "`sqrt(9)`", "Both"]
  answer: 1
  why: Only the name sqrt was imported, not the module name math.
- id: seed-repeat
  type: predict
  code: |
    import random
    random.seed(1)
    a = random.randint(1, 100)
    random.seed(1)
    b = random.randint(1, 100)
    print(a == b)
  why: The same seed restarts the same sequence, so the first number matches.
- id: randint-range
  type: choice
  q: Which values can `random.randint(1, 6)` give?
  options: ["1 to 5", "1 to 6, including 6", "0 to 6"]
  answer: 1
  why: Unlike range, randint includes its top value.
- id: counter-json
  type: predict
  code: |
    import json
    from collections import Counter
    seen = Counter(["cup", "mirror", "cup"])
    print(seen.most_common(1), seen["sock"])
    print(json.dumps({"cup": seen["cup"], "lost": None}))
  why: Counter counts in one go and treats missing keys as 0. json.dumps writes None as null.
