concepts: [import, from ... import, math, random, seeds, the standard library, "collections: Counter and defaultdict", json]
exercises: [warmup, core, outstanding]
scene:
  - who: luna
    line: "The Cabinet doesn't strike at the same time every night. Professor Trelawney says it's random. I think it's just shy."
  - who: hermione
    line: "Nothing a computer does is truly random, Luna. Python's random numbers come from a formula. Start it from the same *seed*, and you get the same numbers every time."
  - who: luna
    line: "(unbothered) So it's shy in a very predictable way. That's nice. My father's like that."
  - who: ginny
    line: "So if we found the Cabinet's seed... we could know exactly when it strikes next?"
  - who: ashwood
    line: "Precisely. Today you borrow spells from Python's library of modules, including the one that makes randomness repeatable. Where would a careful hoarder write its seed down, {name}?"
clue: The Cabinet's seed is scratched on its door. Run it forward and the next strike is certain - **tonight, at midnight**.
outro:
  - who: ron
    line: "Tonight. As in, *tonight* tonight."
  - who: luna
    line: "I'll bring snacks. Cabinets probably don't eat them, but people do."
