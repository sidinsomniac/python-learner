tier: warmup
type: practice
title: Arithmancy with math
task: |
  Write two functions using the `math` module:

  1. `cauldron_volume(radius, height)` returns the volume of a cylindrical
     cauldron, `pi x radius x radius x height`, rounded to 2 decimal places.
  2. `trips_needed(potion, cauldron)` returns how many cauldron-loads it
     takes to brew `potion` litres when each load holds `cauldron` litres -
     a part-full load still counts as a trip. (Use `math.ceil`.)

  ```python
  cauldron_volume(1, 2)      # 6.28
  trips_needed(10, 4)        # 3
  trips_needed(8, 4)         # 2
  ```
