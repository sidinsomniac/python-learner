tests: |
  def test_cabinet():
      fn = student_function("crack")
      got = call(fn, "AOL JHIPULA OBUNLYZ.")
      check(got == (7, "THE CABINET HUNGERS."), f"crack('AOL JHIPULA OBUNLYZ.') returned {got!r}.")
      got = call(fn, "FKDPEHU RI FROOHFWLRQV LV RSHQ")
      check(got == (3, "CHAMBER OF COLLECTIONS IS OPEN"), f"The feast message cracked to {got!r}.")

  def test_short():
      got = call(student_function("crack"), "Ihhg")
      check(got == (3, "Feed"), f"crack('Ihhg') returned {got!r}.")
      got = call(student_function("crack"), "abba")
      check(got == (23, "deed"), f"crack('abba') returned {got!r}. The E-trick from Lesson 13 would say 22 - but 'deed' scores higher than 'effe'.")

  def test_no_letters():
      got = call(student_function("crack"), "12:00!")
      check(got == (0, "12:00!"), f"With no letters, every shift ties at 0 - so the smallest, 0, wins. You returned {got!r}.")

  def test_round_trip():
      fn = student_function("crack")
      message = "Meet me in the bathroom at midnight and bring the counter-spell."
      for shift in (0, 1, 13, 25):
          coded = "".join([chr((ord(c) - ord("a") + shift) % 26 + ord("a")) if "a" <= c <= "z" else
                           chr((ord(c) - ord("A") + shift) % 26 + ord("A")) if "A" <= c <= "Z" else c for c in message])
          got = call(fn, coded)
          check(got == (shift, message), f"A message shifted by {shift} cracked to {got!r}.")

  def test_uses_toolkit():
      check(calls("letter_frequencies") and calls("caesar_shift"), "Build on your toolkit - crack should call caesar_shift and letter_frequencies.")
hints:
  nudge: A loop over the 26 shifts. Inside it, decode, score, and keep the best so far.
  question: Which way do you shift to decode an attempt with shift s? When should a new score replace the best - when it's bigger, or bigger-or-equal?
  pseudocode: |
    best_shift = 0, best_score = -1, best_text = the text
    for each shift from 0 to 25:
        attempt = the text shifted back by that shift
        score = sum of ENGLISH[letter] times count, for each letter in attempt's frequencies
        if score is strictly bigger than best_score: remember shift, score, attempt
    give back (best_shift, best_text)
  flaw: If a no-letter text returns shift 25, you replaced on equal scores. If the shift is right but the text is scrambled, decode by -shift (not +shift).
  analogous: |
    ```python
    best, best_n = None, -1
    for n in range(5):
        value = (n * 7) % 5
        if value > best_n:
            best, best_n = n, value
    ```
