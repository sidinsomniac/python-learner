tier: stage
type: practice
title: "Stage 3: Cracking the Code"
twist: design - try every shift, score each one, break ties fairly
task: |
  Write `crack(text)`, which works out the unknown shift of a coded message
  and returns a tuple `(shift, plain_text)` - where
  `caesar_shift(plain_text, shift)` gives the coded text back.

  1. For **every** shift from 0 to 25, decode the text with that shift.
  2. Score the attempt: for each letter in it, add its `ENGLISH` score times
     how many times it appears. (Use `letter_frequencies`!)
  3. The highest score wins. If two shifts score exactly the same, the
     **smaller** shift wins.

  A text with no letters scores 0 for every shift, so it returns
  `(0, text)`.

  Paste your `caesar_shift` and `letter_frequencies` above `crack`, and keep
  the `ENGLISH` table.

  ```python
  crack("AOL JHIPULA OBUNLYZ.")
  # -> (7, 'THE CABINET HUNGERS.')
  crack("FKDPEHU RI FROOHFWLRQV LV RSHQ")
  # -> (3, 'CHAMBER OF COLLECTIONS IS OPEN')
  ```
