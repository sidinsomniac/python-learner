id: y2-l02
year: 2
order: 3
number: 2
title: Tuples and Unpacking
location: The Grand Staircase
concepts: [tuples, unpacking, swapping, enumerate, tuple comparison]
exercises: [warmup, core, outstanding]
scene:
  - who: ginny
    line: "(unrolling a map covered in tiny crosses) I've been marking every vanishing. Each one is a pair: the floor, and the corridor. Two numbers that belong together."
  - who: ron
    line: "When did you do all this? Why not just use a list?"
  - who: ginny
    line: "Because a place doesn't *change*, Ron. The second floor, east corridor is always the second floor, east corridor."
  - who: ron
    line: "(opening his mouth, then closing it) ...Fair."
  - who: ashwood
    line: "Miss Weasley has just discovered the tuple, a collection that promises never to change. What else in a castle should never change, {name}?"
clue: Line the vanishings up and one number never changes - every single one happened on the **second floor**.
outro:
  - who: ginny
    line: "(very quietly) The second floor. That's where..."
  - who: ron
    line: "Where what?"
  - who: ginny
    line: "(folding the map away fast) Nothing. Just a bathroom. Nobody goes there."
