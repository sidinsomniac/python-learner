id: y2-l04
year: 2
order: 8
number: 4
title: Sets
location: The Great Hall
concepts: [set, add and discard, membership speed, union, intersection, difference]
exercises: [warmup, core, outstanding]
scene:
  - who: hermione
    line: "New approach. For every vanishing, we list everyone who was nearby. Whoever was near ALL of them is our thief."
  - who: ron
    line: "That's loads of names. Some people will be on the lists twice..."
  - who: draco
    line: "(passing, with Crabbe and Goyle) I hope you've written my name down, Weasley. I'd hate to be left out."
  - who: ron
    line: "(hotly) Oh, you're on it, Malfoy. Top of the list. Your dad sells cursed junk for a living."
  - who: draco
    line: "(the smirk slipping, just for a second) ...Careful, Weasley."
  - who: ashwood
    line: "Sets, then: collections with no duplicates, built for questions like \"who is in every group?\" What does it mean if the answer is nobody, {name}?"
clue: The sets don't lie. **Nobody** was near every vanishing - not one person. So the thief isn't a person at all. **It's an object.**
outro:
  - who: ginny
    line: "An object. Something that *sits there* and takes things."
  - who: ron
    line: "(glancing after Draco) So it wasn't him."
  - who: hermione
    line: "No, Ron. Not this time."
