# Time-Turner and Dueling Club cards for this lesson.
- id: filter-map
  type: predict
  code: |
    hearts = [5, 1, 3, 7]
    print([h * 2 for h in hearts if h > 2])
  why: Keep 5, 3 and 7, then double each.
- id: if-position
  type: choice
  q: Where does the filtering `if` go in a list comprehension?
  options: ["Before the `for`", "At the end, after the `for ... in ...`", "Inside the brackets of `in`"]
  answer: 1
  why: "`[x for x in items if x > 0]` - the filter comes last."
- id: nested-for
  type: predict
  code: |
    grid = [[1, 2], [3]]
    print([x for row in grid for x in row])
  why: Two fors read left to right like nested loops - each row, then each value in it.
