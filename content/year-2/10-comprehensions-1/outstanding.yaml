tier: outstanding
type: practice
title: Mirror, Mirror
twist: constraint - nested comprehensions only, no `for` statements
task: |
  Lockhart's portrait gallery is a grid (a list of rows). Using **only
  comprehensions** - no `for` statements at all - print:

  1. The grid **flipped left-to-right** (each row reversed):
     `[[3, 2, 1], [6, 5, 4]]`
  2. The grid **transposed** - rows become columns:
     `[[1, 4], [2, 5], [3, 6]]`
  3. Every value **flattened** into one list, row by row:
     `[1, 2, 3, 4, 5, 6]`

  Keep the first line. Assume every row has the same length, and the grid
  has at least one row.
starter: |
  grid = [[1, 2, 3], [4, 5, 6]]
tests: |
  def _run(g):
      return run_with(grid=g).lines

  def test_example():
      got = _run([[1, 2, 3], [4, 5, 6]])
      check(got == ["[[3, 2, 1], [6, 5, 4]]", "[[1, 4], [2, 5], [3, 6]]", "[1, 2, 3, 4, 5, 6]"], f"You printed {got}.")

  def test_square():
      got = _run([[1, 2], [3, 4]])
      check(got == ["[[2, 1], [4, 3]]", "[[1, 3], [2, 4]]", "[1, 2, 3, 4]"], f"You printed {got}.")

  def test_single_row():
      got = _run([["a", "b"]])
      check(got == ["[['b', 'a']]", "[['a'], ['b']]", "['a', 'b']"], f"For one row you printed {got}.")

  def test_no_for():
      check(not uses(ast.For), "Only comprehensions this time - no `for` statements.")
      check(count_nodes(ast.ListComp) >= 4, "Transposing and flattening each need a comprehension INSIDE (or with two fors in) another.")
hints:
  nudge: A comprehension's expression can itself be a comprehension. And a comprehension can have TWO `for` parts, read left to right like nested loops.
  question: For the transpose, the new row number `c` holds `row[c]` from every old row. How many new rows are there? For flattening, what would the two nested `for` loops look like?
  pseudocode: |
    flipped: for each row, that row reversed
    transposed: for each column position c, [row[c] for each row]
    flattened: value, for each row, for each value in that row
  flaw: If the transpose comes out the same as the grid, your inner and outer loops are the wrong way round.
  analogous: |
    ```python
    table = [[1, 2], [3, 4]]
    print([[x * 10 for x in row] for row in table])
    print([x for row in table for x in row if x > 1])
    ```
